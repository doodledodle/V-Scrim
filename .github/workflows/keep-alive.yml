name: Keep Supabase Alive

on:
  schedule:
    # 매 3일마다 자정(UTC 기준)에 실행
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub 웹페이지에서 수동으로 실행할 수 있는 옵션

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
               "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=id&limit=1"
